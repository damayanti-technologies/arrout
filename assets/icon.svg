<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#312E81" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Circular ambient glow -->
  <circle cx="256" cy="256" r="180" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="256" cy="256" r="140" fill="#FFFFFF" opacity="0.06"/>
  <!-- Main dynamic arrow escape symbol -->
  <g filter="url(#glow)">
    <!-- Main shaft -->
    <path d="M140 256 H340" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <path d="M260 176 L340 256 L260 336" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Escaping trail dots -->
    <circle cx="396" cy="256" r="14" fill="#38BDF8"/>
    <circle cx="438" cy="256" r="9" fill="#38BDF8" opacity="0.8"/>
  </g>
</svg>
